<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b2b"><meta name="apple-mobile-web-app-capable" content="yes"><title>戦線指揮 — FIELD COMMAND</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=0.1.2"></head>
<body><div id="app">
<header id="battleHeader"><div class="turn-status"><b id="turn"></b><span id="phaseName" role="status"></span></div><button id="objective" class="mission-link" aria-label="勝利条件と戦況"></button><button id="menuBtn" class="subtle" aria-label="マップと設定">メニュー</button></header>
<div class="map-wrap"><div id="forecast" role="status" hidden></div><div id="mapViewport" tabindex="0" aria-label="戦場。青部隊を選んで移動先をタップ"><canvas id="battlefield"></canvas></div><div class="map-tools"><button id="zoomOut" aria-label="縮小">−</button><span id="zoomLabel">全景</span><button id="zoomIn" aria-label="拡大">＋</button><button id="homeBtn">自軍へ</button><button id="dangerBtn" aria-pressed="false">危険域</button></div><canvas id="minimap" width="64" height="120" aria-label="戦場の全体図"></canvas><div id="phaseFlash" aria-live="polite"></div><section id="orders" aria-label="部隊の命令"></section></div>
<footer><button id="rosterBtn">部隊表</button><button id="logBtn">戦闘記録</button><button id="endTurn" class="primary">命令終了 →</button></footer>
</div>
<dialog id="modal"><div id="modalBody"></div><button id="closeModal" class="wide">戦場へ戻る</button></dialog>
<script type="module">import('./app.js?v=0.1.2');</script></body></html>

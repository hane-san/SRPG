<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#27232e"><meta name="apple-mobile-web-app-capable" content="yes"><title>戦線指揮 — FIELD COMMAND</title><link rel="icon" href="assets/icon-32.png" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=0.7.0"></head>
<body><div id="app">
<header id="battleHeader"><div class="turn-status"><b id="turn"></b><span id="phaseName" role="status"></span></div><button id="objective" class="mission-link" aria-label="勝利条件と戦況"></button><button id="soundBtn" aria-label="効果音の切替" aria-pressed="true">SE ON</button><button id="menuBtn" class="subtle" aria-label="マップと設定">メニュー</button></header>
<div class="map-wrap"><div id="forecast" role="status" hidden></div><div id="mapViewport" tabindex="0" aria-label="戦場。部隊と空きマスをタップで移動。攻撃可能地点は押したまま敵へスライド。部隊からのスライドは離して命令を選択"><canvas id="battlefield"></canvas></div><div class="map-tools"><button id="toolsToggle" aria-expanded="false" aria-controls="mapToolChoices">表示</button><div id="mapToolChoices" hidden><button id="zoomOut" aria-label="縮小">−</button><span id="zoomLabel">全景</span><button id="zoomIn" aria-label="拡大">＋</button><button id="homeBtn">自軍へ</button><button id="dangerBtn" aria-pressed="false">危険域</button></div></div><canvas id="minimap" width="64" height="120" aria-label="戦場の全体図"></canvas><div id="phaseFlash" aria-live="polite"></div></div><div id="commandDock"><div id="commandHint">部隊を選択してください</div><section id="orders" aria-label="部隊の命令"></section></div>
<footer><button id="rosterBtn">部隊表</button><button id="logBtn" aria-label="戦闘記録">記録</button><button id="nextUnit" aria-label="次の未行動部隊（N）">次の部隊</button><button id="endTurn" class="primary">命令終了 →</button></footer>
</div>
<dialog id="modal"><div id="modalBody"></div><button id="closeModal" class="wide">戦場へ戻る</button></dialog>
<script type="module">import('./app.js?v=0.7.0');</script></body></html>
